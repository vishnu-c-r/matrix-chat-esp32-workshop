; =============================================================
;  PlatformIO configuration — pioarduino (Arduino-ESP32 core 3.x)
; =============================================================

[platformio]
default_envs = esp32c3_node

; ------------------------------------------------------------------
; Shared base for all ESP32 embedded targets
; No external libs needed — WebServer, ESP-NOW and mbedtls are
; all built into the Arduino-ESP32 core.
; ------------------------------------------------------------------
[env:base_esp32]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework     = arduino
monitor_speed = 115200
build_flags   =
    -Wall
    -Wextra
    -std=gnu++17
    -Os

; ------------------------------------------------------------------
; ESP32-S3 DevKitC-1 — Node (chat participant)
; ------------------------------------------------------------------
[env:esp32s3_node]
extends      = env:base_esp32
board        = esp32-s3-devkitc-1
build_flags  =
    ${env:base_esp32.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_ROLE_NODE=1
build_src_filter =
    -<*>
    +<node/main.cpp>
    +<common/radio.cpp>
    +<common/led.cpp>
    +<common/dedupe.cpp>
    +<common/web.cpp>

; ------------------------------------------------------------------
; ------------------------------------------------------------------
[env:esp32dev_node]
extends      = env:base_esp32
board        = esp32dev
build_flags  =
    ${env:base_esp32.build_flags}
    -DBOARD_ROLE_NODE=1
build_src_filter =
    -<*>
    +<node/main.cpp>
    +<common/radio.cpp>
    +<common/led.cpp>
    +<common/dedupe.cpp>
    +<common/web.cpp>

; ------------------------------------------------------------------
; ------------------------------------------------------------------
[env:esp32c3_node]
extends      = env:base_esp32
board        = esp32-c3-devkitm-1
build_flags  =
    ${env:base_esp32.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_ROLE_NODE=1
build_src_filter =
    -<*>
    +<node/main.cpp>
    +<common/radio.cpp>
    +<common/led.cpp>
    +<common/dedupe.cpp>
    +<common/web.cpp>

; ------------------------------------------------------------------
; ------------------------------------------------------------------
[env:esp32c3_student]
extends      = env:esp32c3_node
build_flags  =
    ${env:esp32c3_node.build_flags}
    -DSTUDENT_BUILD=1

; ------------------------------------------------------------------
; Native (desktop) — Unity unit tests
; Tests pure-logic modules: rssi_tracker, dedupe, corrupt, protocol
; ------------------------------------------------------------------
[env:native]
platform     = native
lib_deps     = ThrowTheSwitch/Unity
test_framework = unity
build_flags  =
    -Wall
    -Wextra
    -std=c++17
    -DNATIVE_TEST=1
